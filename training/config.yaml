seed: 42

dataset:
  name: theatticusproject/cuad-qa
  revision: refs/convert/parquet
  fallback_names:
    - chenghao/cuad_qa
  cache_dir: data/hf_cache
  validation_contract_ratio: 0.1
  max_eval_examples: 1500
  max_train_examples: null

model:
  base_checkpoint: microsoft/deberta-v3-base
  max_seq_length: 384
  doc_stride: 128

preprocessing:
  negative_windows_per_example: 4
  map_batch_size: 32
  num_proc: 1

training:
  output_dir: outputs/veridex-qa
  learning_rate: 3.0e-5
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  num_train_epochs: 4
  weight_decay: 0.01
  warmup_ratio: 0.1
  optim: adamw_torch
  lr_scheduler_type: linear
  precision: auto
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  logging_steps: 50
  metric_for_best_model: eval_f1
  greater_is_better: true
  gradient_checkpointing: false
  dataloader_num_workers: 2

postprocessing:
  n_best_size: 20
  max_answer_length: 256
  null_score_diff_threshold: -2.0

metrics:
  high_precision_target: 0.8
  span_match_f1_threshold: 0.5

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_location: mlruns
  experiment_name: veridex-qa-cuad
  registered_model_name: Veridex-QA
  staging_alias: staging
  log_error_artifacts: true
  max_error_samples: 200
